spring:
  # the MySQL datasource comes from TestGrayskullApplication (Testcontainers)
  flyway:
    locations: classpath:db/audit
  data:
    mongodb:
      database: grayskull-test
      uri: mongodb://admin:password@host.docker.internal:37017/admin?maxLifeTimeMs=3600000&maxIdleTimeMs=600000&maxConnecting=100&readPreference=secondaryPreferred&w=majority
      auto-index-creation: true

grayskull:
  kms:
    defaultKeyId: "test-key"
  crypto:
    keys:
      test-key: "wVXG0jhpwG0DwTMt3sQK57hukC1Uhl/yUuvH9GOP3B4="
  authorization:
    rules:
      - user: admin
        project: "*"
        secret: "*"
        actions:
          - "*"
      - user: user1
        project: "*"
        actions:
          - "*"
      - user: editor
        project: "test-project"
        actions:
          - "secrets.create"
          - "secrets.read.metadata"
          - "secrets.read.value"
          - "secrets.update"
          - "secrets.delete"
          - "secrets.list"
      - user: viewer
        project: "test-project"
        actions:
          - "secrets.list"
          - "secrets.read.metadata"
      - user: "service:automated-task"
        project: "*"
        actions:
          - "secrets.create"
          - "secrets.read.value"
      - user: "human:john.doe"
        project: "*"
        actions:
          - "secrets.create"
          - "secrets.read.value"
  audit:
    service-user-prefix: "service:"
    human-user-prefix: "human:"
    max-query-age-days: 180
    # tests run the outbox relayer themselves (AuditOutboxRelayer#tick), as often as they need
    relayer:
      cron: "-"
      lock-at-least-for: PT0S